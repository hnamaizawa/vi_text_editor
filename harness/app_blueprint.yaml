project:
  name: vi_text_editor
  version: 0.1.25
  platform: windows
  ui: winforms
  editor_component: Scintilla5.NET
  development_runtime: .NET 10
  distribution: self-contained Windows x64 + single-file Windows x64 + GitHub Releases

development_model:
  - human_describes_requirements_in_natural_language
  - ai_changes_only_necessary_files
  - ai_runs_regression_tests_and_build_checks
  - ai_updates_readme_change_history_for_every_versioned_pull_request_before_merge
  - ai_opens_pull_request
  - human_reviews_pull_request
  - ai_merges_only_after_human_requests_merge
  - successful_versioned_main_merge_automatically_creates_version_tag_and_github_release
  - ai_verifies_latest_release_contains_single_file_exe_and_portable_zip_after_merge
  - ai_provides_downloadable_portable_zip_and_single_file_exe_after_successful_merge

non_negotiable_invariants:
  - versioned_pull_requests_must_update_readme_change_history_before_merge
  - error_and_warning_dialogs_must_not_play_system_effect_sounds
  - normal_mode_must_not_insert_printable_text
  - insert_mode_must_allow_normal_ime_input
  - ime_composition_must_track_editor_caret
  - escape_must_return_to_normal_mode
  - vi_commands_must_not_corrupt_document_text
  - caret_motion_must_move_to_first_nonblank_character
  - vi_word_and_WORD_motions_must_remain_distinct
  - percent_motion_must_match_parentheses_brackets_and_braces
  - counted_percent_motion_must_jump_to_file_percentage
  - vi_find_motions_must_support_f_F_t_T_semicolon_and_comma
  - vi_sentence_and_paragraph_motions_must_support_parentheses_and_braces
  - vi_window_motions_must_support_H_M_and_L
  - vi_line_motions_must_support_plus_minus_underscore_and_bar
  - ctrl_e_and_ctrl_y_must_scroll_view_without_editing_text
  - numeric_prefixes_must_apply_to_normal_mode_cursor_motions
  - pending_find_target_must_be_consumed_as_a_motion_character_not_an_edit_command
  - supplemental_motion_routing_must_never_intercept_colon_slash_or_question_command_prefixes
  - punctuation_motions_must_be_routed_from_the_actual_input_character_not_layout_dependent_oem_keycodes
  - change_word_commands_must_delete_target_and_enter_insert_mode
  - delete_word_commands_must_support_dw_dW_de_dE_and_line_end_delete
  - dot_must_repeat_the_last_change_not_plain_navigation_or_yank
  - dot_must_repeat_put_delete_change_and_insert_text_changes
  - insert_repeat_must_preserve_ime_committed_text_and_backspace_edits
  - ctrl_f_and_ctrl_b_must_move_one_page_with_caret_following
  - ctrl_d_and_ctrl_u_must_move_half_page_with_caret_following
  - slash_and_question_search_must_support_n_and_N_repeat
  - search_must_honor_global_ignorecase_and_pattern_backslash_c_backslash_C_overrides
  - colon_command_mode_must_be_visible_and_escape_cancelable
  - command_and_search_histories_must_be_separate_and_recallable_with_up_down
  - colon_set_ic_and_set_noic_must_toggle_global_ignorecase
  - colon_set_ignorecase_must_apply_to_text_and_binary_search
  - colon_numeric_command_must_jump_to_requested_line
  - colon_yank_must_support_single_lines_ranges_and_named_registers
  - colon_yank_count_must_support_y3_y_space_3_and_named_register_count
  - colon_yank_count_must_start_at_current_line_and_clamp_at_end_of_file
  - colon_and_normal_mode_must_share_the_same_unnamed_register
  - ex_yank_must_be_pasteable_with_normal_p_and_P
  - normal_yank_must_be_available_to_ex_put
  - colon_put_must_support_named_registers_and_target_lines
  - uppercase_named_register_yank_must_append_to_lowercase_register
  - colon_delete_must_support_current_line_ranges_and_register_capture
  - colon_substitute_must_support_ranges_global_flag_and_case_flags
  - colon_substitute_must_honor_ignorecase_when_i_or_I_is_not_specified
  - colon_edit_bang_must_reload_current_file_and_discard_buffer_changes
  - colon_edit_hash_must_open_alternate_file
  - colon_edit_filename_must_open_requested_file_and_block_on_unsaved_changes_without_bang
  - colon_quit_must_refuse_dirty_buffer_without_bang
  - colon_quit_bang_must_close_without_dirty_prompt
  - colon_wq_and_x_must_follow_vim_write_then_quit_semantics
  - colon_write_filename_must_write_a_copy_without_renaming_current_buffer
  - colon_saveas_must_write_and_rename_current_buffer
  - colon_write_bang_must_allow_overwriting_existing_target
  - alternate_file_must_track_previous_current_file
  - editor_must_start_in_editable_mode_by_default
  - reference_mode_must_remain_available_as_an_explicit_opt_in
  - reference_mode_must_allow_navigation_yank_set_and_search_but_block_mutating_ex_commands
  - reference_mode_must_block_document_modification
  - workspace_must_support_multiple_document_tabs_without_sharing_text_buffers
  - workspace_ctrl_t_ctrl_w_and_ctrl_tab_must_manage_tabs
  - workspace_ctrl_pageup_and_pagedown_must_switch_tabs_even_when_a_viewer_has_focus
  - workspace_tab_switch_must_focus_the_newly_selected_tab_content
  - workspace_json_and_markdown_shortcuts_must_target_only_the_selected_editor_tab
  - inactive_tab_toolstrip_shortcuts_must_not_execute_document_actions
  - windows_shell_file_arguments_must_open_existing_files_at_startup
  - windows_shell_file_arguments_with_spaces_must_be_supported
  - multiple_startup_file_arguments_must_open_as_multiple_tabs
  - normal_application_launch_must_be_single_instance_per_windows_user_and_session
  - secondary_launch_must_forward_file_arguments_to_the_existing_workspace_and_exit
  - forwarded_files_must_open_through_the_existing_workspace_OpenPath_tab_flow
  - forwarding_an_already_open_file_must_select_the_existing_tab_instead_of_duplicating_it
  - file_drag_and_drop_onto_the_running_workspace_must_open_existing_files_as_tabs
  - file_drag_and_drop_must_reuse_the_same_OpenPath_flow_as_other_workspace_file_open_actions
  - recent_files_must_persist_under_user_appdata_and_deduplicate_paths
  - files_at_or_above_64_mib_must_open_in_large_file_mode_automatically
  - large_file_mode_must_not_read_the_entire_file_into_a_string_or_byte_array
  - large_file_mode_must_be_read_only_and_use_sparse_line_indexing
  - large_file_mode_must_support_j_k_ctrl_f_ctrl_b_ctrl_d_ctrl_u_gg_G_and_search
  - large_file_mode_must_honor_set_ic_for_text_search
  - status_bar_must_show_one_based_X_and_Y_coordinates
  - status_bar_must_keep_X_and_Y_coordinates_visible_at_the_right_edge
  - coordinate_display_must_not_depend_on_toolstrip_overflow_layout
  - syntax_highlighting_must_follow_the_current_file_extension
  - markdown_headings_must_be_visually_emphasized
  - syntax_highlighting_must_not_modify_document_text
  - json_formatting_must_accept_valid_single_line_json
  - json_formatting_may_normalize_bom_unicode_whitespace_and_separated_numeric_signs
  - json_formatting_normalization_must_not_change_quoted_string_contents
  - json_formatting_must_be_undoable_and_refuse_reference_mode
  - json_formatting_reference_mode_decision_must_use_reference_mode_state_not_scintilla_readonly
  - json_formatting_must_preserve_the_active_document_newline_style
  - json_formatting_must_preserve_readable_japanese_unicode_instead_of_forcing_u_escape_sequences
  - markdown_preview_must_render_in_a_separate_tab_without_modifying_source_text
  - markdown_preview_must_support_j_k_ctrl_f_ctrl_b_ctrl_d_ctrl_u_gg_and_G_navigation
  - markdown_preview_must_support_slash_question_n_and_N_search
  - markdown_preview_must_support_visible_colon_command_mode
  - markdown_preview_command_prefixes_must_use_actual_character_input_not_layout_dependent_oem_keycodes
  - markdown_preview_must_accept_set_ic_set_noic_and_set_ic_query
  - markdown_preview_must_honor_set_ic_and_set_noic_for_search
  - ctrl_mouse_wheel_zoom_must_be_debounced_to_avoid_repeated_reflow_and_waving
  - ctrl_mouse_wheel_zoom_must_preserve_the_document_view_anchor_as_much_as_possible
  - status_position_updates_must_not_scan_entire_document_per_keypress
  - normal_vi_motion_must_use_native_position_apis_instead_of_full_document_copies
  - scintilla_layout_cache_must_cover_visible_page
  - scintilla_extra_buffered_draw_must_be_disabled_on_windows
  - binary_mode_must_be_read_only_and_virtualized
  - binary_mode_must_show_offset_hex_and_text_columns
  - binary_text_column_must_support_utf8_shift_jis_utf16_and_ascii_selection
  - binary_text_column_must_render_japanese_with_a_japanese_capable_monospaced_font
  - binary_text_auto_detection_must_prefer_bom_then_valid_utf8_then_shift_jis
  - binary_mode_must_support_j_k_ctrl_f_ctrl_b_ctrl_d_ctrl_u_gg_and_G_navigation
  - binary_mode_must_support_slash_question_n_and_N_search
  - binary_mode_must_accept_colon_set_ic_and_set_noic
  - binary_search_must_honor_ignorecase_for_text_search_but_not_raw_hex_search
  - binary_search_must_support_selected_text_encoding_and_hex_byte_patterns
  - binary_search_must_stream_file_chunks_instead_of_materializing_the_entire_file
  - binary_mode_must_not_materialize_the_entire_file_as_hex_text
  - binary_file_must_be_openable_directly_without_text_decode
  - direct_binary_view_must_preserve_the_existing_text_buffer
  - normal_mode_caret_must_be_visually_distinct
  - editor_font_must_prefer_japanese_monospaced_font
  - undo_must_not_go_before_initial_loaded_document_state
  - undo_reaching_save_point_must_clear_dirty_indicator
  - redo_leaving_save_point_must_restore_dirty_indicator
  - file_save_must_preserve_selected_encoding
  - file_save_must_not_silently_change_line_endings
  - unsaved_changes_must_prompt_before_close
  - unrelated_features_must_not_be_changed
  - core_vi_behavior_must_remain_gui_independent_and_unit_testable
  - portable_windows_distribution_must_not_require_dotnet_installation
  - single_file_windows_distribution_must_not_require_dotnet_installation
  - single_file_windows_distribution_must_bundle_native_libraries_for_self_extraction
  - single_file_windows_distribution_must_contain_exactly_one_vi_text_editor_executable
  - single_file_startup_must_configure_scintilla_native_directory_before_first_scintilla_use
  - portable_and_single_file_distributions_must_pass_real_startup_smoke_tests
  - portable_and_single_file_distributions_must_pass_windows_shell_open_smoke_tests
  - portable_and_single_file_distributions_must_pass_single_instance_forwarding_smoke_tests
  - github_release_tag_must_match_project_version
  - successful_versioned_main_merge_must_publish_a_github_release
  - github_release_must_be_marked_latest
  - github_release_must_include_versioned_single_file_exe_and_portable_zip_assets
  - pull_requests_must_pass_core_tests_windows_build_portable_publish_single_file_publish_startup_shell_open_and_single_instance_forwarding_smoke_tests

required_checks:
  - dotnet test tests/ViTextEditor.Core.Tests/ViTextEditor.Core.Tests.csproj --configuration Release
  - dotnet build src/ViTextEditor/ViTextEditor.csproj --configuration Release
  - dotnet publish src/ViTextEditor/ViTextEditor.csproj --configuration Release --runtime win-x64 --self-contained true
  - dotnet publish src/ViTextEditor/ViTextEditor.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false
  - artifacts/vi_text_editor-win-x64/vi_text_editor.exe --startup-smoke-test
  - artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe --startup-smoke-test
  - artifacts/vi_text_editor-win-x64/vi_text_editor.exe --startup-open-smoke-test "path with spaces.txt"
  - artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe --startup-open-smoke-test "path with spaces.txt"
  - portable primary process plus secondary file launch must pass single-instance forwarding smoke test
  - single-file primary process plus secondary file launch must pass single-instance forwarding smoke test