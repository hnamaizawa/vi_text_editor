name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore core tests
        run: dotnet restore tests/ViTextEditor.Core.Tests/ViTextEditor.Core.Tests.csproj
      - name: Run core tests
        run: dotnet test tests/ViTextEditor.Core.Tests/ViTextEditor.Core.Tests.csproj --configuration Release --no-restore

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore application
        run: dotnet restore src/ViTextEditor/ViTextEditor.csproj
      - name: Build application
        run: dotnet build src/ViTextEditor/ViTextEditor.csproj --configuration Release --no-restore
      - name: Publish portable Windows x64 build
        run: dotnet publish src/ViTextEditor/ViTextEditor.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/vi_text_editor-win-x64
      - name: Verify portable executable
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/vi_text_editor-win-x64/vi_text_editor.exe")) {
            throw "Portable executable was not created."
          }
      - name: Smoke-test portable startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList "--startup-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Portable startup smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test URL indicator byte ranges
        shell: pwsh
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP "url-indicator-smoke-result.txt"
          $arguments = "--url-indicator-smoke-test `"$diagnostic`""
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "URL indicator range smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Upload URL indicator smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: url-indicator-smoke-diagnostic
          path: ${{ runner.temp }}/url-indicator-smoke-result.txt
          if-no-files-found: error
      - name: Smoke-test blank-tab replacement and tab reorder
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList "--workspace-tab-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Workspace tab smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test portable Windows shell file open
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "vi text editor shell open smoke.txt"
          Set-Content -Path $sample -Value "Windows shell startup smoke test" -Encoding utf8
          $arguments = "--startup-open-smoke-test `"$sample`""
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Portable shell-open smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test portable existing-instance file receive
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "vi text editor portable forwarded file.txt"
          $marker = Join-Path $env:RUNNER_TEMP "vi-text-editor-portable-single-instance.pass"
          Set-Content -Path $sample -Value "Existing instance receive smoke test" -Encoding utf8
          Remove-Item $marker -ErrorAction SilentlyContinue
          $primaryArgs = "--single-instance-receive-smoke-test `"$marker`" `"$sample`""
          $primary = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList $primaryArgs -PassThru
          try {
            Start-Sleep -Seconds 1
            $secondary = Start-Process -FilePath "artifacts/vi_text_editor-win-x64/vi_text_editor.exe" -ArgumentList "`"$sample`"" -PassThru -Wait
            if ($secondary.ExitCode -ne 0) {
              throw "Portable forwarding process failed with exit code $($secondary.ExitCode)."
            }
            $deadline = (Get-Date).AddSeconds(15)
            while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
            if (-not (Test-Path $marker)) { throw "Portable primary instance did not receive the forwarded file." }
          }
          finally {
            if (-not $primary.HasExited) { Stop-Process -Id $primary.Id -Force }
          }
      - name: Upload portable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vi_text_editor-win-x64
          path: artifacts/vi_text_editor-win-x64/
          if-no-files-found: error

      - name: Publish single-file Windows x64 build
        run: >-
          dotnet publish src/ViTextEditor/ViTextEditor.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/vi_text_editor-win-x64-single-file
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
      - name: Verify single-file executable
        shell: pwsh
        run: |
          $outputDir = "artifacts/vi_text_editor-win-x64-single-file"
          $files = @(Get-ChildItem -Path $outputDir -Recurse -File)
          if ($files.Count -ne 1) {
            $names = ($files | ForEach-Object { $_.FullName }) -join "`n"
            throw "Single-file publish must contain exactly one file, but found $($files.Count):`n$names"
          }
          if ($files[0].Name -ne "vi_text_editor.exe") {
            throw "Single-file publish produced unexpected file: $($files[0].Name)"
          }
          if ($files[0].Length -le 0) {
            throw "Single-file executable is empty."
          }
      - name: Smoke-test single-file startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe" -ArgumentList "--startup-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Single-file startup smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test single-file blank-tab replacement and tab reorder
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe" -ArgumentList "--workspace-tab-smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Single-file workspace tab smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test single-file Windows shell file open
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "vi text editor single file shell open smoke.txt"
          Set-Content -Path $sample -Value "Windows shell startup smoke test" -Encoding utf8
          $arguments = "--startup-open-smoke-test `"$sample`""
          $process = Start-Process -FilePath "artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe" -ArgumentList $arguments -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Single-file shell-open smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Smoke-test single-file existing-instance file receive
        shell: pwsh
        run: |
          $sample = Join-Path $env:RUNNER_TEMP "vi text editor single forwarded file.txt"
          $marker = Join-Path $env:RUNNER_TEMP "vi-text-editor-single-file-instance.pass"
          Set-Content -Path $sample -Value "Existing instance receive smoke test" -Encoding utf8
          Remove-Item $marker -ErrorAction SilentlyContinue
          $primaryArgs = "--single-instance-receive-smoke-test `"$marker`" `"$sample`""
          $primary = Start-Process -FilePath "artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe" -ArgumentList $primaryArgs -PassThru
          try {
            Start-Sleep -Seconds 1
            $secondary = Start-Process -FilePath "artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe" -ArgumentList "`"$sample`"" -PassThru -Wait
            if ($secondary.ExitCode -ne 0) {
              throw "Single-file forwarding process failed with exit code $($secondary.ExitCode)."
            }
            $deadline = (Get-Date).AddSeconds(15)
            while (-not (Test-Path $marker) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
            if (-not (Test-Path $marker)) { throw "Single-file primary instance did not receive the forwarded file." }
          }
          finally {
            if (-not $primary.HasExited) { Stop-Process -Id $primary.Id -Force }
          }
      - name: Upload single-file Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: vi_text_editor-win-x64-single-file
          path: artifacts/vi_text_editor-win-x64-single-file/vi_text_editor.exe
          if-no-files-found: error
